<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSpend — Login</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            background: #050b18;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Segoe UI', sans-serif;
            overflow: hidden;
        }

        /* Animated background */
        body::before {
            content: '';
            position: fixed;
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(0,245,255,0.08) 0%, transparent 70%);
            top: -200px; left: -200px;
            animation: float 8s ease-in-out infinite;
        }
        body::after {
            content: '';
            position: fixed;
            width: 500px; height: 500px;
            background: radial-gradient(circle, rgba(0,255,148,0.06) 0%, transparent 70%);
            bottom: -150px; right: -150px;
            animation: float 10s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(30px, 30px); }
        }

        .card {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px;
            padding: 2.5rem;
            width: 420px;
            backdrop-filter: blur(20px);
            box-shadow: 0 20px 60px rgba(0,0,0,0.5);
            position: relative;
            z-index: 1;
            animation: slideUp 0.4s ease;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo h1 {
            font-size: 1.8rem;
            font-weight: 800;
            color: #fff;
            letter-spacing: -0.5px;
        }
        .logo span {
            color: #00f5ff;
        }
        .logo p {
            font-size: 0.85rem;
            color: rgba(255,255,255,0.4);
            margin-top: 0.3rem;
        }

        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(255,255,255,0.04);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 1.5rem;
        }
        .tab {
            flex: 1;
            padding: 0.6rem;
            text-align: center;
            border-radius: 9px;
            cursor: pointer;
            font-size: 0.875rem;
            font-weight: 500;
            color: rgba(255,255,255,0.4);
            transition: all 0.2s;
            border: none;
            background: transparent;
        }
        .tab.active {
            background: rgba(0,245,255,0.15);
            color: #00f5ff;
            border: 1px solid rgba(0,245,255,0.3);
        }

        /* Form */
        .form { display: none; }
        .form.active { display: block; }

        .input-group {
            margin-bottom: 1rem;
        }
        .input-group label {
            display: block;
            font-size: 0.8rem;
            color: rgba(255,255,255,0.5);
            margin-bottom: 0.4rem;
        }
        .input-group input {
            width: 100%;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 12px;
            padding: 0.75rem 1rem;
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: all 0.2s;
            font-family: 'Segoe UI', sans-serif;
        }
        .input-group input:focus {
            border-color: rgba(0,245,255,0.4);
            background: rgba(0,245,255,0.05);
        }
        .input-group input::placeholder {
            color: rgba(255,255,255,0.2);
        }

        .btn {
            width: 100%;
            padding: 0.85rem;
            border-radius: 12px;
            border: none;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 0.5rem;
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #00f5ff, #00ff94);
            color: #050b18;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,245,255,0.3);
        }
        .btn:active { transform: translateY(0); }

        .message {
            margin-top: 1rem;
            padding: 0.75rem 1rem;
            border-radius: 10px;
            font-size: 0.85rem;
            text-align: center;
            display: none;
        }
        .message.success {
            background: rgba(0,255,148,0.1);
            border: 1px solid rgba(0,255,148,0.2);
            color: #00ff94;
            display: block;
        }
        .message.error {
            background: rgba(244,114,182,0.1);
            border: 1px solid rgba(244,114,182,0.2);
            color: #f472b6;
            display: block;
        }
    </style>
</head>
<body>

<div class="card">
    <div class="logo">
        <h1>💰 Auto<span>Spend</span></h1>
        <p>AI-Powered UPI Expense Tracker</p>
    </div>

    <div class="tabs">
        <button class="tab active" onclick="switchTab('login')">Login</button>
        <button class="tab" onclick="switchTab('register')">Register</button>
    </div>

    <!-- Login Form -->
    <div class="form active" id="login-form">
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="login-email" placeholder="you@example.com" />
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="login-password" placeholder="••••••••" />
        </div>
        <button class="btn" onclick="login()">Login →</button>
        <div class="message" id="login-message"></div>
    </div>

    <!-- Register Form -->
    <div class="form" id="register-form">
        <div class="input-group">
            <label>Full Name</label>
            <input type="text" id="reg-name" placeholder="Shashank" />
        </div>
        <div class="input-group">
            <label>Email</label>
            <input type="email" id="reg-email" placeholder="you@example.com" />
        </div>
        <div class="input-group">
            <label>Password</label>
            <input type="password" id="reg-password" placeholder="••••••••" />
        </div>
        <button class="btn" onclick="register()">Create Account →</button>
        <div class="message" id="register-message"></div>
    </div>
</div>

<script>
    const API_BASE = 'api';

    // Check if already logged in
    if (localStorage.getItem('userId')) {
        window.location.href = 'index.html';
    }

    function switchTab(tab) {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.form').forEach(f => f.classList.remove('active'));
        event.target.classList.add('active');
        document.getElementById(tab + '-form').classList.add('active');
    }

    async function login() {
        const email = document.getElementById('login-email').value;
        const password = document.getElementById('login-password').value;
        const msg = document.getElementById('login-message');

        if (!email || !password) {
            showMessage(msg, 'Please fill all fields!', 'error');
            return;
        }

        try {
            const res = await fetch(
                `${API_BASE}/auth/login?email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`,
                { method: 'POST' }
            );
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('userName', data.name);
                showMessage(msg, `Welcome back, ${data.name}! Redirecting...`, 'success');
                setTimeout(() => window.location.href = 'index.html', 1000);
            } else {
                showMessage(msg, data.message, 'error');
            }
        } catch (err) {
            showMessage(msg, 'Connection error!', 'error');
        }
    }

    async function register() {
        const name = document.getElementById('reg-name').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const msg = document.getElementById('register-message');

        if (!name || !email || !password) {
            showMessage(msg, 'Please fill all fields!', 'error');
            return;
        }

        try {
            const res = await fetch(
                `${API_BASE}/auth/register?name=${encodeURIComponent(name)}&email=${encodeURIComponent(email)}&password=${encodeURIComponent(password)}`,
                { method: 'POST' }
            );
            const data = await res.json();
            if (data.success) {
                localStorage.setItem('userId', data.userId);
                localStorage.setItem('userName', data.name);
                showMessage(msg, 'Account created! Redirecting...', 'success');
                setTimeout(() => window.location.href = 'index.html', 1000);
            } else {
                showMessage(msg, data.message, 'error');
            }
        } catch (err) {
            showMessage(msg, 'Connection error!', 'error');
        }
    }

    function showMessage(el, text, type) {
        el.textContent = text;
        el.className = `message ${type}`;
    }
</script>
</body>
</html>
